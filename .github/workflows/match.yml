          if (e <= 20) {
          int ub = 64 - 2 * stable_count(O, A);
          if (ub <= alpha) return ub;
          if (ub < beta) { beta = ub; if (alpha >= beta) return ub; }
          }
          int useTT = e >= 10, ix = 0, ttmove = 64; u64 key = 0; TTE *ent = 0;
          if (useTT) {
          key = zhash(P, O, BLACK) ^ (u64)e; ix = key & TTMASK; ent = &TT[ix];
          if (ent->key == key && ent->gen == ttgen) {
          ttmove = ent->move;
          if (ent->depth >= e) {
          if (ent->lo >= beta) return ent->lo;
          if (ent->hi <= alpha) return ent->hi;
          if (ent->lo == ent->hi) return ent->lo;
          if (ent->lo > alpha) alpha = ent->lo;
          if (ent->hi < beta) beta = ent->hi;
          }
          }
          }
          int sq[36], sc[36], n = 0, i; u64 fl[36], x = mv;
          while (x) { int s = CTZ(x); x &= x - 1; sq[n] = s; fl[n] = get_flips(P, O, s); n++; }
          int wide = e >= 12;
          for (i = 0; i < n; i++) {
          int s = sq[i], v = ((par >> QUAD[s]) & 1) ? 128 : 0;
          if (s == ttmove) v += 1 << 20;
          else {
          u64 nP = P | fl[i] | (1ULL << s), nO = O & ~fl[i];
          v += (SQV[s] >> 2) - (int)PC(get_moves(nO, nP)) * (wide ? 12 : 6);
          if (wide) v -= 2 * (int)PC(neighbours(nP) & ~(nP | nO));
          }
          sc[i] = v;
          }
          int a0 = alpha, best = -INF, bmove = sq[0];
          for (i = 0; i < n; i++) {
          int bj = i, j, s; u64 f;
          for (j = i + 1; j < n; j++) if (sc[j] > sc[bj]) bj = j;
          if (bj != i) { int t; u64 tu;
          t = sq[i]; sq[i] = sq[bj]; sq[bj] = t; t = sc[i]; sc[i] = sc[bj]; sc[bj] = t;
          tu = fl[i]; fl[i] = fl[bj]; fl[bj] = tu; }
          s = sq[i]; f = fl[i];
          u64 nP = P | f | (1ULL << s), nO = O & ~f;
          int np = par ^ (1 << QUAD[s]), v;
          if (i == 0) v = -solve_e(nO, nP, e - 1, -beta, -alpha, ply + 1, np, 0);
          else {
          v = -solve_e(nO, nP, e - 1, -alpha - 1, -alpha, ply + 1, np, 0);
          if (!g_abort && v > alpha && v < beta) v = -solve_e(nO, nP, e - 1, -beta, -alpha, ply + 1, np, 0);
          }
          if (g_abort) return 0;
          if (v > best) { best = v; bmove = s; if (v > alpha) { alpha = v; if (alpha >= beta) break; } }
          }
          if (useTT && (ent->gen != ttgen || ent->depth <= e)) {
          ent->key = key; ent->depth = e; ent->move = bmove; ent->gen = ttgen;
          if (best <= a0) { ent->lo = -100; ent->hi = best; }
          else if (best >= beta) { ent->lo = best; ent->hi = 100; }
          else { ent->lo = best; ent->hi = best; }
