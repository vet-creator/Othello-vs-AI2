          return best;
          }
          static int parity_of(u64 A) {
          int p = 0, q, s;
          for (q = 0; q < 4; q++) { int c = 0;
          for (s = 0; s < 64; s++) if (QUAD[s] == q && !((A >> s) & 1)) c++;
          if (c & 1) p |= 1 << q; }
          return p;
          }
          static int R_score, R_depth;
          static void sync_feat(u64 P, u64 O, int col) {
          if (col == BLACK) feat_build(P, O); else feat_build(O, P);
          }
          static int root_go(u64 P, u64 O, int col, double budget) {
          u64 A = P | O, mv = get_moves(P, O);
          int nd = PC(A), empties = 64 - nd, i;
          if (!mv) return -1;
          int sq[36], n = 0, sc[36]; u64 fl[36], x = mv;
          while (x) { int s = CTZ(x); x &= x - 1; sq[n] = s; fl[n] = get_flips(P, O, s); n++; }
          R_score = 0; R_depth = 0; g_nodes = 0; g_abort = 0;
          if (n == 1) return sq[0];
          double t0 = now_ms();
          for (i = 0; i < 128; i++) { KILL1[i] = -1; KILL2[i] = -1; }
          int exactTh = budget >= 7000 ? 22 : (budget >= 2500 ? 20 : 18);
          int wldTh = budget >= 7000 ? 26 : (budget >= 2500 ? 24 : 22);
          int bestsq = sq[0];
          if (empties <= wldTh) {
          tt_new(); sync_feat(P, O, col);
          g_deadline = t0 + budget * 0.30;
          int pd = empties - 10; if (pd < 4) pd = 4; if (pd > 10) pd = 10;
          int alpha = -INF;
          for (i = 0; i < n; i++) {
          u64 nP = P | fl[i] | (1ULL << sq[i]), nO = O & ~fl[i];
          feat_do(sq[i], fl[i], col);
          sc[i] = -search(nO, nP, 3 - col, pd - 1, -INF, -alpha, 1, nd + 1, 0);
          feat_undo(sq[i], fl[i], col);
          if (sc[i] > alpha) alpha = sc[i];
          }
          g_abort = 0;
          for (i = 0; i < n; i++) { int bj = i, j; for (j = i + 1; j < n; j++) if (sc[j] > sc[bj]) bj = j;
          if (bj != i) { int t; u64 tu; t = sq[i]; sq[i] = sq[bj]; sq[bj] = t;
          t = sc[i]; sc[i] = sc[bj]; sc[bj] = t; tu = fl[i]; fl[i] = fl[bj]; fl[bj] = tu; } }
          int par = parity_of(A);
          if (empties <= exactTh) {
          tt_new(); g_deadline = t0 + budget * 1.25;
          int a = -65, best = -INF, bs = sq[0];
          for (i = 0; i < n; i++) {
          u64 nP = P | fl[i] | (1ULL << sq[i]), nO = O & ~fl[i];
          int np = par ^ (1 << QUAD[sq[i]]), v;
          if (i == 0) v = -solve_e(nO, nP, empties - 1, -65, -a, 1, np, 0);
          else {
          v = -solve_e(nO, nP, empties - 1, -a - 1, -a, 1, np, 0);
          if (!g_abort && v > a && v < 65) v = -solve_e(nO, nP, empties - 1, -65, -a, 1, np, 0);
          }
          if (g_abort) break;
          if (v > best) { best = v; bs = sq[i]; if (v > a) a = v; }
          }
          if (!g_abort) { R_score = best; R_depth = empties; return bs; }
          g_abort = 0;
          }
          g_deadline = t0 + budget * 1.95;
          int pass2;
          for (pass2 = 0; pass2 < 2; pass2++) {
          int lo = pass2 == 0 ? 0 : -1, hi = pass2 == 0 ? 1 : 0;
          tt_new();
          for (i = 0; i < n; i++) {
          u64 nP = P | fl[i] | (1ULL << sq[i]), nO = O & ~fl[i];
          int v = -solve_e(nO, nP, empties - 1, -hi, -lo, 1, par ^ (1 << QUAD[sq[i]]), 0);
          if (g_abort) break;
          if (v >= hi) { R_score = pass2 == 0 ? 1 : 0; R_depth = empties; return sq[i]; }
          }
          if (g_abort) break;
          }
          if (!g_abort) { R_score = -1; R_depth = empties; return sq[0]; }
          g_abort = 0;
          }
          tt_new(); sync_feat(P, O, col);
          double t1 = now_ms();
          double softEnd = t1 + budget * 0.40;
          g_deadline = t1 + budget * 0.95;
          int maxd = empties > 34 ? 34 : empties, d, done = 0, bscore = 0;
          for (d = 2; d <= maxd; d++) {
          if (d > 3 && now_ms() > softEnd) break;
          int alpha = -INF, ibest = -INF, isq = -1, comp = 0;
          for (i = 0; i < n; i++) {
          u64 nP = P | fl[i] | (1ULL << sq[i]), nO = O & ~fl[i];
          int v;
          feat_do(sq[i], fl[i], col);
          if (i == 0) v = -search(nO, nP, 3 - col, d - 1, -INF, INF, 1, nd + 1, 0);
          else {
          v = -search(nO, nP, 3 - col, d - 1, -alpha - 1, -alpha, 1, nd + 1, 0);
          if (!g_abort && v > alpha) v = -search(nO, nP, 3 - col, d - 1, -INF, -alpha, 1, nd + 1, 0);
