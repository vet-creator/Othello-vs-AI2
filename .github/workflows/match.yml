          feat_undo(sq[i], fl[i], col);
          if (g_abort) break;
          sc[i] = v; comp++;
          if (v > ibest) { ibest = v; isq = sq[i]; if (v > alpha) alpha = v; }
          }
          if (g_abort) {
          if (comp > 0 && (done == 0 || ibest > bscore)) { bestsq = isq; bscore = ibest; done = d; }
