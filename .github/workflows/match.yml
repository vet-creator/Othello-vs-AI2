          int v = (e == 1) ? -final_diff(nO, nP, 0) : -solve_tiny(nO, nP, e - 1, -beta, -alpha, 0);
          if (v > best) { best = v; if (v > alpha) { alpha = v; if (alpha >= beta) return best; } }
          }
