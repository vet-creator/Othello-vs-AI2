name: Ultimate Native AI Match (Windows EXE)

on:
  workflow_dispatch:
    inputs:
      games:
        description: "対局数(色は1局ごとに入れ替え)"
        default: "2"
      move_ms:
        description: "1手の思考時間(ms)"
        default: "8000"
      ega_level:
        description: "Egaroucidのレベル(15〜30推奨)"
        default: "21"
      ega_tag:
        description: "Egaroucid for Consoleのタグ"
        default: "console_v7.8.1"

jobs:
  match-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      GAMES: ${{ github.event.inputs.games || '2' }}
      MOVE_MS: ${{ github.event.inputs.move_ms || '8000' }}
      EGA_LEVEL: ${{ github.event.inputs.ega_level || '21' }}
      EGA_TAG: ${{ github.event.inputs.ega_tag || 'console_v7.8.1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Egaroucid (Windows release)
        shell: bash
        run: |
          echo "Fetching release info for tag: ${EGA_TAG}"
          API_URL="https://api.github.com/repos/Nyanyan/Egaroucid/releases/tags/${EGA_TAG}"
          
          # SIMD(AVX2)版を優先的に検索
          DOWNLOAD_URL=$(curl -sL "$API_URL" | jq -r '.assets[].browser_download_url | select(type == "string")' | grep -i 'Windows' | grep -i 'SIMD' | head -n 1)
          
          # 見つからなかった場合はGeneric版などを探す
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL=$(curl -sL "$API_URL" | jq -r '.assets[].browser_download_url | select(type == "string")' | grep -i 'Windows' | head -n 1)
          fi
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "エラー: 指定されたタグ (${EGA_TAG}) のWindows用ZIPが見つかりません。"
            exit 1
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          curl -sL -o ega.zip "$DOWNLOAD_URL"
          
          # 解凍
          unzip -q ega.zip -d ega_temp
          
          # .exeファイルの名前がバージョン等で異なる場合があるため、柔軟に検索する
          EGA_EXE_PATH=$(find ega_temp -iname "*.exe" | grep -i "Egaroucid" | head -n 1)
          
          if [ -z "$EGA_EXE_PATH" ]; then
            echo "エラー: ZIP内に Egaroucid の .exe が見つかりませんでした。"
            exit 1
          fi
          
          echo "Executable found at: $EGA_EXE_PATH"
          EGA_DIR=$(dirname "$EGA_EXE_PATH")
          
          # exeがあるフォルダごと ega/ にリネーム
          mv "$EGA_DIR" ega
          
          # 実行ファイル名をJS側と一致させる
          EGA_BASENAME=$(basename "$EGA_EXE_PATH")
          if [ "$EGA_BASENAME" != "Egaroucid_for_Console.exe" ]; then
            mv "ega/$EGA_BASENAME" "ega/Egaroucid_for_Console.exe"
          fi
          echo "Egaroucid extracted successfully to ega/ directory."

      - name: Verify KOKUBYAKU files
        shell: bash
        run: |
          if [ ! -f "KOKUBYAKU_Native.exe" ] || [ ! -f "weights.bin" ]; then
          echo "エラー: リポジトリ直下に KOKUBYAKU_Native.exe と weights.bin が見つかりません。"
          exit 1
          fi

      - name: Write Match Driver
        shell: bash
        run: |
          cat << 'EOF' > match-driver.js
          'use strict';
          const { spawn } = require('child_process');
          const fs = require('fs');
          const GAMES = parseInt(process.env.GAMES || '2', 10);
          const MOVE_MS = parseInt(process.env.MOVE_MS || '8000', 10);
          const EGA_LEVEL = parseInt(process.env.EGA_LEVEL || '21', 10);
          function log(...a) {
          const s = a.join(' ');
          console.log(s);
          fs.appendFileSync('match.log', s + '\n');
          }
          class Gtp {
          constructor(bin, args, cwd, name) {
          this.name = name;
          this.buf = '';
          this.queue = [];
          this.proc = spawn(bin, args, { cwd, stdio: ['pipe', 'pipe', 'pipe'] });
          this.proc.stdout.setEncoding('utf8');
          // ★ここでWindowsの改行コード(\r)を削除し、Linux(\n)に統一して解釈エラーを回避
          this.proc.stdout.on('data', d => { this.buf += d.replace(/\r/g, ''); this.drain(); });
          this.proc.stderr.setEncoding('utf8');
          this.proc.stderr.on('data', d => fs.appendFileSync(`${name}.stderr.log`, d));
          this.proc.on('exit', code => {
          while (this.queue.length) this.queue.shift().rej(new Error(`${name} exited: ${code}`));
          });
          }
          drain() {
          for (;;) {
          const m = this.buf.match(/(^|\n)[=?]/);
          if (!m) { if (this.buf.length > 1 << 20) this.buf = this.buf.slice(-4096); return; }
          const from = m.index + m[1].length;
          const end = this.buf.indexOf('\n\n', from);
          if (end < 0) return;
          const chunk = this.buf.slice(from, end);
          this.buf = this.buf.slice(end + 2);
          const ok = chunk[0] === '=';
          const body = chunk.replace(/^[=?]\s*\d*\s?/, '').trim();
          const w = this.queue.shift();
          if (w) w.res({ ok, body });
          }
          }
          send(cmd, timeoutMs = 600000) {
          return new Promise((res, rej) => {
          const t = setTimeout(() => rej(new Error(`GTP timeout on ${this.name}: ${cmd}`)), timeoutMs);
          this.queue.push({
          res: v => { clearTimeout(t); res(v); },
          rej: e => { clearTimeout(t); rej(e); }
          });
          fs.appendFileSync('gtp.log', `${this.name} > ${cmd}\n`);
          this.proc.stdin.write(cmd + '\n');
          }).then(v => {
          fs.appendFileSync('gtp.log', `${this.name} < ${v.ok ? '=' : '?'} ${v.body}\n`);
          return v;
          });
          }
          }
          async function playGame(ega, koku, egaColor, gameNo) {
          await ega.send('clear_board');
          await koku.send('clear_board');
          let turn = 1, passCount = 0;
          const moves = [];
          log(`\n=== Game ${gameNo}: Egaroucid = ${egaColor === 1 ? 'BLACK' : 'WHITE'} / KOKUBYAKU = ${egaColor === 1 ? 'WHITE' : 'BLACK'} ===`);
          while (passCount < 2) {
          const colorStr = turn === 1 ? 'B' : 'W';
          const engine = (turn === egaColor) ? ega : koku;
          const opponent = (turn === egaColor) ? koku : ega;
          const r = await engine.send(`genmove ${colorStr}`, MOVE_MS * 5 + 120000);
          if (!r.ok) throw new Error(`${engine.name} genmove failed: ${r.body}`);
          const move = r.body.split(/\s+/)[0].toUpperCase();
          if (move === 'PASS' || move === 'pass') {
          passCount++;
          log(`  ${moves.length.toString().padStart(2)} ${engine.name.padEnd(10)} ${colorStr} PASS`);
          await opponent.send(`play ${colorStr} PASS`);
          } else {
          passCount = 0;
          moves.push(`${colorStr}:${move}`);
          log(`  ${moves.length.toString().padStart(2)} ${engine.name.padEnd(10)} ${colorStr} ${move}`);
          await opponent.send(`play ${colorStr} ${move}`);
          }
          turn = 3 - turn;
          }
          const kokuCountRes = await koku.send('count');
          const m = kokuCountRes.body.match(/B: (\d+) W: (\d+)/);
          let b = 0, w = 0;
          if (m) { b = parseInt(m[1], 10); w = parseInt(m[2], 10); }
          const egaScore = egaColor === 1 ? b : w;
          const kokuScore = egaColor === 1 ? w : b;
          let result = 'Draw';
          if (egaScore > kokuScore) result = 'Egaroucid Win';
          else if (kokuScore > egaScore) result = 'KOKUBYAKU Win';
          log(`--- Game ${gameNo} End: Black ${b} - White ${w} / Egaroucid ${egaScore} - KOKUBYAKU ${kokuScore} => ${result}`);
          return { gameNo, egaColor: egaColor === 1 ? 'black' : 'white', black: b, white: w, egaroucid: egaScore, kokubyaku: kokuScore, result, moves };
          }
          (async () => {
          fs.writeFileSync('match.log', '');
          fs.writeFileSync('gtp.log', '');
          // パスの指定方法をWindowsで最も安全な形に修正
          const ega = new Gtp('Egaroucid_for_Console.exe', ['-gtp'], 'ega', 'Egaroucid');
          const koku = new Gtp('KOKUBYAKU_Native.exe', [], '.', 'KOKUBYAKU');
          const egaName = await ega.send('name', 5000);
          const kokuName = await koku.send('name', 5000);
          log(`[Engines] ${egaName.body} vs ${kokuName.body}`);
          await ega.send(`time_settings 0 ${Math.max(1, Math.round(MOVE_MS / 1000))} 1`).catch(()=>{});
          await ega.send(`level ${EGA_LEVEL}`).catch(()=>{});
          await koku.send(`kokubyaku_time ${MOVE_MS}`);
          const results = [];
          try {
          for (let i = 0; i < GAMES; i++) {
          results.push(await playGame(ega, koku, i % 2 === 0 ? 1 : 2, i + 1));
          }
          } finally {
          const tally = { games: results.length, egaroucid_wins: 0, koku_wins: 0, draws: 0 };
          for (const r of results) {
          if (r.result.includes('Egaroucid Win')) tally.egaroucid_wins++;
          else if (r.result.includes('KOKUBYAKU Win')) tally.koku_wins++;
          else tally.draws++;
          }
          fs.writeFileSync('result.json', JSON.stringify({ tally, results }, null, 2));
          log('\n===== TOTAL =====');
          log(`Egaroucid ${tally.egaroucid_wins} - ${tally.koku_wins} KOKUBYAKU (Draw ${tally.draws})`);
          if (process.env.GITHUB_STEP_SUMMARY) {
          let md = '## Ultimate Native Match Result (Windows)\n\n';
          md += `**Egaroucid ${tally.egaroucid_wins} - ${tally.koku_wins} KOKUBYAKU** (Draw ${tally.draws})\n\n`;
          md += `* Time limit per move: ${MOVE_MS} ms\n`;
          md += `* Egaroucid Level: ${EGA_LEVEL}\n\n`;
          md += '| Game | Egaroucid | Black | White | Result |\n|:---:|:---:|:---:|:---:|:---|\n';
          for (const r of results) md += `| ${r.gameNo} | ${r.egaColor} | ${r.black} | ${r.white} | **${r.result}** |\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          }
          try { await ega.send('quit', 2000); } catch(e){}
          try { await koku.send('quit', 2000); } catch(e){}
          }
          })().catch(e => { log('[FATAL] ' + (e && e.stack || e)); process.exit(1); });
          EOF

      - name: Run Match
        shell: bash
        run: node match-driver.js

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: othello-match-logs
          path: |
            match.log
            gtp.log
            *.stderr.log
            result.json
          if-no-files-found: warn
